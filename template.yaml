AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Openlytic email lambda - send_email orchestration (reads app_queue rows, delivers via SES)

Parameters:
  PostgresUrl:
    Type: String
    Description: RDS connection string for the API Server Postgres (app_queue is the durable source of truth)
  EmailDeliveryMode:
    Type: String
    Default: stub
    AllowedValues: [ses, stub]
    Description: 'ses = real Amazon SES, stub = log + fake MessageId (dev)'
  DefaultFromEmail:
    Type: String
    Default: no-reply@openlytic.local
  SendQueueArn:
    Type: String
    Description: SQS queue ARN for the send_email event source
  EmailTrackingSecret:
    Type: String
    Default: ''
    Description: HMAC secret for tracking tokens (must match the API server's TRACKING_SECRET)
  EmailTrackingBaseUrl:
    Type: String
    Default: ''
    Description: Public base URL the tracking endpoints are served from (API Gateway URL)
  SnsWebhookSignatureVerification:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 'Verify the SNS webhook message signature against the AWS cert (false only for offline dev/E2E)'

Globals:
  Function:
    Timeout: 60
    MemorySize: 512
    Runtime: nodejs22.x
    Environment:
      Variables:
        POSTGRES_URL: !Ref PostgresUrl
        EMAIL_DELIVERY_MODE: !Ref EmailDeliveryMode
        DEFAULT_FROM_EMAIL: !Ref DefaultFromEmail
        EMAIL_TRACKING_SECRET: !Ref EmailTrackingSecret
        EMAIL_TRACKING_BASE_URL: !Ref EmailTrackingBaseUrl
        SNS_WEBHOOK_SIGNATURE_VERIFICATION: !Ref SnsWebhookSignatureVerification

Resources:
  EmailServiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/
      Handler: index.handler
      Events:
        SendQueue:
          Type: SQS
          Properties:
            Queue: !Ref SendQueueArn
            BatchSize: 10
        TrackingOpen:
          Type: HttpApi
          Properties:
            Path: /email-tracking/open
            Method: GET
        TrackingClick:
          Type: HttpApi
          Properties:
            Path: /email-tracking/click
            Method: GET
        TrackingAttachmentView:
          Type: HttpApi
          Properties:
            Path: /email-tracking/attachment-view
            Method: GET
        TrackingWebhook:
          Type: HttpApi
          Properties:
            Path: /email-tracking/webhook
            Method: POST
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSPollerPolicy:
            QueueName: openlytic-send-queue

Outputs:
  EmailFunctionArn:
    Value: !GetAtt EmailServiceFunction.Arn
